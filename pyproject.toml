[project]
name = "medicoes"
version = "0.1.0"
description = "Lançamento de medições de contratos no Sienge, em lote, com validação antes e conferência depois."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
medicoes = "medicoes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medicoes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
